<!DOCTYPE html>
<html lang="en">
<head>
    <link
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
  rel="stylesheet"
/>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - TechTalk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
 
  <header class="navbar">
    <div class="logo">TechTalk</div>
    <button class="menu-toggle" aria-label="Toggle Menu">
      ☰
    </button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="#articles">Articles</a></li>
      <li><a href="#footer-about">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
      <i class="fas fa-moon"></i> <!-- Default Moon Icon -->
    </button>
  </header>
  

  <div class="contact-container">
    <h1>Contact Us</h1>
    <form action="https://formspree.io/f/your-form-id" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name.." required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Your email.." required>

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Write something.." style="height:200px" required></textarea>

      <input type="submit" value="Submit">
    </form>
  </div>

  <footer id="footer-about">
    <div class="footer-about-container">
      <h2>About Me</h2>
      <p>Hi, I'm <strong>Rudeshwar Parmar</strong>, a tech enthusiast and web developer...</p>
    </div>
    <div class="footer-end">
      <p>&copy; 2025 TechTalk. All rights reserved.</p>
    </div>
  </footer>
  <script src="script.js"> </script>
</body>
</html>
